name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'macOS'
        run: |
          xcrun swiftc -typecheck ImportPaste.swift
          xcrun swiftc -typecheck tests/CreatePasteFixture.swift
